<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile | NearbyFriends</title>
  <link rel="icon" type="image/png" href="/assets/NearbyShareLogo.svg" />
  <link rel="stylesheet" href="/css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Subtle mesh background */
    .page-bg {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 5%,  rgba(22,163,74,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(16,185,129,0.07) 0%, transparent 60%);
    }

    /* Glow primary button */
    .btn-primary-glow {
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff !important;
      border: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(34,197,94,0.3);
    }
    .btn-primary-glow:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(34,197,94,0.4);
    }

    /* Pulsing online status indicator */
    .pulse-online {
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      }
      70% {
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }
  </style>
</head>

<body class="page-bg min-h-screen flex flex-col justify-between items-center p-4">

  <!-- Header Banner -->
  <header class="w-full max-w-md text-center mt-6 mb-4">
    <span class=" skeleton px-3 font-black text-xl tracking-tight text-gray-900">
      <span class="text-green-600">Nearby</span>Friends
    </span>
  </header>

  <!-- LOADING OVERLAY -->
  <div id="loadingProfile" class="flex flex-col justify-center items-center flex-1 my-12">
    <button class="btn btn-ghost no-animation flex flex-col gap-2">
      <span class="loading loading-spinner text-success loading-lg"></span>
      <span class="text-gray-500 font-semibold text-sm">Loading your profile...</span>
    </button>
  </div>

  <!-- PROFILE CARD CONTENT -->
  <div class="card w-full max-w-md bg-white/95 backdrop-blur-md border border-gray-100 shadow-2xl rounded-3xl mb-8 hidden transition-all duration-300 transform scale-95 opacity-1" id="content">
    <div class="card-body p-8">
      <div class="flex flex-col items-center mb-6">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-green-500 to-emerald-400 p-0.5 shadow-lg relative group">
          <div class="w-full h-full rounded-full bg-white flex items-center justify-center text-2xl font-extrabold text-green-600 shadow-inner tracking-wider" id="profileAvatar">
            NF
          </div>
          <span class="absolute bottom-0 right-0 w-5 h-5 bg-green-500 border-2 border-white rounded-full pulse-online"></span>
        </div>
        <h2 class="text-2xl font-extrabold text-gray-900 text-center mt-3">Complete Your Profile</h2>
        <p class="text-xs text-gray-400 mt-1">This info is visible to users online around you</p>
      </div>

      <fieldset class="fieldset w-full">
        <!-- Name Input -->
        <div class="form-control w-full mb-4">
          <label class="label pb-1">
            <span class="label-text font-bold text-gray-600 text-xs uppercase tracking-wider">Your Name</span>
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              id="nameInput"
              placeholder="John Doe"
              class="input input-bordered pl-11 focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-2xl bg-gray-50/50"
              required
            />
          </div>
        </div>

        <!-- Age Input -->
        <div class="form-control w-full mb-4">
          <label class="label pb-1">
            <span class="label-text font-bold text-gray-600 text-xs uppercase tracking-wider">Your Age</span>
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              type="number"
              id="ageInput"
              placeholder="25"
              class="input input-bordered pl-11 focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-2xl bg-gray-50/50"
              required
            />
          </div>
        </div>

        <!-- About TextArea -->
        <div class="form-control w-full mb-6">
          <label class="label pb-1">
            <span class="label-text font-bold text-gray-600 text-xs uppercase tracking-wider">About Yourself</span>
          </label>
          <div class="relative flex items-start">
            <span class="absolute left-4 top-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </span>
            <textarea
              id="aboutInput"
              placeholder="Tell us a little about your hobbies, what you do..."
              class="textarea textarea-bordered pl-11 pt-2.5 focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-2xl bg-gray-50/50 h-28 resize-none"
              required
            ></textarea>
          </div>
        </div>

        <!-- Save Button -->
        <button id="saveProfileBtn" class="btn btn-outline w-full rounded-full text-base font-bold py-3.5 h-auto min-h-0">
          Save Profile
        </button>
      </fieldset>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer footer-center p-6 bg-white/80 border border-gray-100 shadow-inner rounded-3xl w-full max-w-md mb-4">
    <p class="text-gray-400 text-xs">
      © 2026 NearbyFriends &nbsp;·&nbsp; From
      <a href="https://soraalpha.tech/" target="_blank"
         class="badge badge-success text-white font-semibold mx-1 hover:opacity-80 transition-opacity"
         title="Alpha of Software Solution">SoraAlpha</a>
    </p>
  </footer>

  <script type="module" src="../server/firebase.js"></script>
  <script type="module" src="../server/completeProfile.js"></script>
</body>
</html>
