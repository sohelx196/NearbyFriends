<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Friends | NearbyFriends</title>
  <link rel="icon" type="image/png" href="/assets/NearbyShareLogo.svg" />
  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/showReqMsg.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Subtle mesh background */
    .page-bg {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 5%,  rgba(22,163,74,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(16,185,129,0.07) 0%, transparent 60%);
    }

    /* Pulsing online status indicator */
    .pulse-online {
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      }
      70% {
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }
  </style>
</head>

<body class="page-bg min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <nav class="navbar bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 shadow-sm px-4 md:px-10">
    <div class="flex-none">
      <a href="/" class="btn btn-sm btn-circle btn-ghost-g flex items-center justify-center p-0 border-none bg-gray-50 hover:bg-gray-100">
        <img src="../../assets/undo.png" alt="GoBack" class="w-4 h-4 opacity-70" />
      </a>
    </div>
    <div class="flex-1 justify-center md:justify-start px-2 ml-2">
      <span class="font-extrabold text-lg md:text-xl text-gray-900 tracking-tight">
        Online Friends Around You
      </span>
    </div>

    <!-- <div class="flex-none gap-2 hidden md:flex">
      <div class="avatar">
        <div class="w-8 h-8 rounded-full ring ring-green-300 ring-offset-1">
          <img src="/assets/NearbyShareLogo.svg" alt="logo" />
        </div>
      </div>
    </div> -->

  </nav>

  <!-- Main section -->
  <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-8">
    <section id="nearbySection" class="w-full min-h-[400px] flex flex-col items-center justify-center">
      
      <!-- Radar Scanner Loader -->
      <div id="radarScanner" class="flex flex-col items-center justify-center py-12">
        <div class="relative w-32 h-32 flex items-center justify-center mb-6">
          <div class="absolute inset-0 rounded-full bg-green-500/10 animate-ping" style="animation-duration: 3s;"></div>
          <div class="absolute inset-2 rounded-full bg-green-500/20 animate-ping" style="animation-duration: 2s;"></div>
          <div class="absolute inset-4 rounded-full bg-green-500/30 animate-ping" style="animation-duration: 1.2s;"></div>
          <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-green-500 to-emerald-400 flex items-center justify-center text-white shadow-lg z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </div>
        </div>
        <p class="text-sm font-bold text-gray-700 tracking-wide animate-pulse">Scanning for friends around you...</p>
        <p class="text-xs text-gray-400 mt-1.5">Make sure location access is enabled</p>
      </div>

      <!-- Friends Grid (hidden by default, shown when items are loaded) -->
      <div id="friendsList" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full hidden"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer footer-center p-6 bg-white border-t border-gray-100 mt-auto">
    <p class="text-gray-400 text-xs">
      © 2026 NearbyFriends &nbsp;·&nbsp; A
      <a href="https://soraalpha.netlify.app/" target="_blank"
         class="badge badge-success text-white font-semibold mx-1 hover:opacity-80 transition-opacity"
         title="Alpha of Software Solution">SoraAlpha</a>
      Product
    </p>
  </footer>

  <script type="module" src="../../server/firebase.js"></script>
  <script type="module" src="../../server/authManager.js"></script>
  <script type="module" src="discover.js"></script>
</body>
</html>
