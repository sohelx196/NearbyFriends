<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent Chats | NearbyFriends</title>
  <link rel="icon" type="image/png" href="/assets/NearbyShareLogo.svg" />
  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/input.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Subtle mesh background */
    .page-bg {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 5%,  rgba(22,163,74,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(16,185,129,0.07) 0%, transparent 60%);
    }

    /* Glow primary button */
    .btn-primary-glow {
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff !important;
      border: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(34,197,94,0.25);
    }
    .btn-primary-glow:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(34,197,94,0.35);
    }
  </style>
</head>

<body class="page-bg min-h-screen flex flex-col">

  <!-- HEADER -->
  <nav class="navbar bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 shadow-sm px-4 md:px-10">
    <div class="flex-none">
      <a href="/" class="btn btn-sm btn-circle btn-ghost-g flex items-center justify-center p-0 border-none bg-gray-50 hover:bg-gray-100">
        <img src="../../assets/undo.png" alt="GoBack" class="w-4 h-4 opacity-70" />
      </a>
    </div>
    <div class="flex-1 justify-center md:justify-start px-2 ml-2">
      <span class="font-extrabold text-lg md:text-xl text-gray-900 tracking-tight">
        Recent Chats
      </span>
    </div>
    <!-- <div class="flex-none">
      <div class="avatar">
        <div class="w-8 h-8 rounded-full ring ring-green-300 ring-offset-1">
          <img src="/assets/NearbyShareLogo.svg" alt="logo" />
        </div>
      </div>
    </div> -->
  </nav>

  <!-- MAIN LIST CONTAINER -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 py-8">
    <ul id="recentList" class="flex flex-col gap-4 w-full">
      <!-- Programmatically populated by recentChats.js -->
    </ul>
  </main>

  <!-- CARD TEMPLATE -->
  <template class="chat-card-template">
    <li class="bg-white border border-gray-100 shadow-sm hover:shadow-md transition-shadow rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div class="flex items-center gap-4 flex-1 min-w-0">
        <!-- Profile Avatar Ring -->
        <div class="avatar">
          <div class="w-12 h-12 rounded-full ring ring-green-100 ring-offset-2">
            <img src="../../assets/NearbyFriends.gif" alt="profile" />
          </div>
        </div>
        <!-- Profile Info -->
        <div class="flex-1 min-w-0">
          <h2 class="chatName text-base font-bold text-gray-900 truncate">
            Loading...
          </h2>
          <p class="chatMessage text-sm text-gray-500 truncate mt-1">
            Loading...
          </p>
        </div>
      </div>
      <!-- Actions -->
      <div class="flex gap-2 w-full sm:w-auto justify-end">
        <button class="openBtn btn btn-sm btn-primary-glow rounded-full px-5 font-bold">
          Message
        </button>
        <button class="deleteBtn btn btn-sm btn-error btn-outline rounded-full px-5 font-bold hover:text-white">
          Delete
        </button>
      </div>
    </li>
  </template>

  <!-- Footer -->
  <!-- <footer class="footer footer-center p-6 bg-white border-t border-gray-100 mt-auto">
    <p class="text-gray-400 text-xs">
      © 2026 NearbyFriends &nbsp;·&nbsp; A
      <a href="https://soraalpha.netlify.app/" target="_blank"
         class="badge badge-success text-white font-semibold mx-1 hover:opacity-80 transition-opacity"
         title="Alpha of Software Solution">SoraAlpha</a>
      Product
    </p>
  </footer> -->

  <script type="module" src="recentChats.js"></script>
</body>
</html>
