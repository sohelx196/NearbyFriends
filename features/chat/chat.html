<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Room | NearbyFriends</title>
  <link rel="icon" type="image/png" href="/assets/NearbyShareLogo.svg" />
  <link rel="stylesheet" href="../../css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Subtle mesh background */
    .page-bg {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 5%,  rgba(22,163,74,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(16,185,129,0.05) 0%, transparent 60%);
    }

    /* Modern scrollbar for messages */
    #messages::-webkit-scrollbar {
      width: 5px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    /* Style injected chat bubbles */
    #messages .chat-bubble {
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.75rem 1.1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    #messages .chat-start .chat-bubble {
      background-color: #ffffff;
      color: #1f2937;
      border: 1px solid #f3f4f6;
      border-bottom-left-radius: 0.125rem;
    }
    #messages .chat-end .chat-bubble {
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #ffffff;
      border-bottom-right-radius: 0.125rem;
    }
  </style>
</head>

<body class="page-bg h-screen flex flex-col">

  <!-- HEADER -->
  <header class="navbar bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 shadow-sm px-4 md:px-10">
    <div class="flex-none">
      <a href="../../features/chat/recentChats.html" class="btn btn-sm btn-circle btn-ghost-g flex items-center justify-center p-0 border-none bg-gray-50 hover:bg-gray-100">
        <img src="../../assets/undo.png" alt="GoBack" class="w-4 h-4 opacity-70" />
      </a>
    </div>
    <div class="flex-1 px-2 ml-3">
      <span id="header" class="badge badge-success badge-outline font-extrabold text-sm px-4 py-3 tracking-wide">
        Loading...
      </span>
    </div>
    <div class="flex-none">
      <div class="avatar">
        <div class="w-14 h-10 ">
          <img src="/assets/NearbyShareLogo.svg" alt="logo" />
        </div>
      </div>
    </div>
  </header>

  <!-- CHAT CONTAINER -->
  <main id="chatContainer" class="flex-1 flex flex-col overflow-hidden max-w-3xl w-full mx-auto bg-transparent">
    <div id="sendBox" class="flex flex-col h-full overflow-hidden">
      
      <!-- Messages box -->
      <div id="messages" class="flex-1 p-4 space-y-4 overflow-y-auto">
        <!-- JS dynamically appends bubbles here -->
      </div>

      <!-- INPUT BAR -->
      <div class="p-4 bg-white/75 backdrop-blur-md border-t border-gray-100 flex gap-2 items-center sticky bottom-0 rounded-t-3xl shadow-lg">
        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          class="input input-bordered focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-full bg-gray-50/50"
          autocomplete="off"
        />
        <button
          id="sendBtn"
          class="btn btn-circle bg-green-600 hover:bg-green-700 text-white border-none shadow-md shadow-green-600/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>

    </div>
  </main>

  <script type="module" src="./chat.js"></script>
</body>
</html>
