<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | NearbyFriends</title>
  <link rel="icon" type="image/png" href="/assets/NearbyShareLogo.svg" />
  <link rel="stylesheet" href="/css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Subtle mesh background */
    .page-bg {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 5%,  rgba(22,163,74,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%, rgba(16,185,129,0.07) 0%, transparent 60%);
    }

    /* Glow primary button */
    .btn-primary-glow {
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff !important;
      border: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(34,197,94,0.3);
    }
    .btn-primary-glow:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(34,197,94,0.4);
    }
  </style>
</head>

<body class="page-bg min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Logo and Header -->
  <div class="text-center mb-8 max-w-sm">
    <div class="flex justify-center mb-2">
      <div class="avatar">
        <div class="w-16 h-16">
          <img src="/assets/NearbyShareLogo.svg" alt="NearbyFriends Logo" />
        </div>
      </div>
    </div>
    <span class="skeleton px-3 font-black text-2xl tracking-tight text-gray-900">
      <span class="text-green-600">Nearby</span>Friends
    </span>
    <p class="text-gray-500 text-sm mt-1">Discover, chat, and connect with people around you.</p>
  </div>

  <!-- Card Wrapper -->
  <div class="card w-full max-w-md bg-white border border-gray-100 shadow-xl rounded-3xl">
    <div class="card-body p-8">
      <h2 class="text-2xl font-extrabold text-gray-900 text-center mb-6">Create Account</h2>

      <fieldset class="fieldset w-full">
        <!-- Email Input -->
        <div class="form-control w-full mb-4">
          <label class="label pb-1.5">
            <span class="label-text font-bold text-gray-600">Email Address</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            class="input input-bordered focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-2xl bg-gray-50/50"
            required
          />
        </div>

        <!-- Password Input -->
        <div class="form-control w-full mb-2">
          <label class="label pb-1.5">
            <span class="label-text font-bold text-gray-600">Password</span>
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            class="input input-bordered focus:border-green-500 focus:ring-1 focus:ring-green-500 w-full rounded-2xl bg-gray-50/50"
            required
          />
        </div>

        <!-- Error Status Message -->
        <div class="min-h-[20px] my-2">
          <p id="signupStatus" class="text-sm font-semibold text-red-600"></p>
        </div>

        <!-- Action Button -->
        <button type="submit" id="signUpBtn" class="btn btn-outline w-full rounded-full text-base font-bold my-2 py-3 h-auto min-h-0">
          Sign Up
        </button>
      </fieldset>

      <!-- Footer Info -->
      <div class="text-center mt-6 pt-4 border-t border-gray-100">
        <p class="text-sm text-gray-500">
          Already have an account?
          <a href="login.html" class="font-bold text-green-600 hover:text-green-700 transition ml-1">
            Login
          </a>
        </p>
      </div>

    </div>
  </div>

  <script type="module" src="./server/firebase.js"></script>
  <script type="module" src="./server/auth.js"></script>
</body>
</html>
